name: Business skill distribution

on:
  pull_request:
  push:
  workflow_dispatch:
    inputs:
      evidence_run_id:
        description: Run containing kai-business-native-evidence (evidence.json and receipt files)
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  development:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare build host tools
        run: |
          sudo apt-get update
          sudo apt-get install -y jq
          echo "KAI_DESKTOP_PWSH=$(command -v pwsh)" >> "$GITHUB_ENV"
      - name: Check generated independent packages and compatibility presets
        run: sh tools/verify-generated.sh
      - name: Check selection, isolation, ownership, migration, archives and native entry contracts
        run: |
          python3 -m unittest discover -s tests/business -v
          python3 tools/business/test-isolated.py --report "$RUNNER_TEMP/business-isolated.json"
      - name: Build twice and compare every byte
        run: |
          sh tools/build-release.sh "$RUNNER_TEMP/release-a"
          sh tools/build-release.sh "$RUNNER_TEMP/release-b"
          diff -ru "$RUNNER_TEMP/release-a" "$RUNNER_TEMP/release-b"
          python3 tools/release/business_release.py verify "$RUNNER_TEMP/release-a"
      - uses: actions/upload-artifact@v4
        with:
          name: kai-business-candidate
          path: ${{ runner.temp }}/release-a/

  release-acceptance:
    if: github.event_name == 'workflow_dispatch'
    needs: development
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: kai-business-candidate
          path: candidate
      - uses: actions/download-artifact@v4
        with:
          name: kai-business-native-evidence
          path: evidence
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ inputs.evidence_run_id }}
      - name: Reject absent, skipped, failed or stale required evidence
        run: python3 tools/release/business_release.py gate candidate --evidence evidence/evidence.json
